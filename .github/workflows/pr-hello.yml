name: PR Greeter

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  greet:
    name: Say hello
    runs-on: ubuntu-latest

    steps:
      - name: Print the context we were given
        run: |
          echo "Event      : ${{ github.event_name }}"
          echo "Repository : ${{ github.repository }}"
          echo "PR number  : ${{ github.event.number }}"
          echo "Author     : ${{ github.actor }}"
          echo "Branch     : ${{ github.head_ref }} -> ${{ github.base_ref }}"
          echo "Runner OS  : ${{ runner.os }}"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' \
            "Thanks for the pull request, @${{ github.actor }}!" \
            "" \
            "The CI pipeline is now running:" \
            "- ESLint" \
            "- Unit tests on Node 18, 20 and 22 across Ubuntu and Windows" \
            "- Production build" \
            "" \
            "_Posted automatically by a GitHub Actions workflow._" > comment.md
          gh pr comment "${{ github.event.number }}" --body-file comment.md
